<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Book Management System</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <div class="container">
    <h1>Book Management System</h1>
    <p>Add, view, edit and delete books.</p>

    <h2 id="formHeading">Add Book</h2>
    <form id="bookForm">
      <input type="hidden" id="bookId">

      <label for="title">Book Title:</label>
      <input type="text" id="title" required>

      <label for="author">Author:</label>
      <input type="text" id="author" required>

      <label for="price">Price (₹):</label>
      <input type="number" id="price" min="0" step="0.01" required>

      <button type="submit" id="submitButton">Add Book</button>
      <button type="button" id="cancelButton" style="display: none;">Cancel</button>
    </form>

    <h2>Book List</h2>
    <p>Total Books: <span id="bookCount">0</span></p>
    <button type="button" id="refreshButton">Refresh List</button>
    <p id="message"></p>

    <div class="table-container">
      <table>
        <thead>
          <tr>
            <th>ID</th>
            <th>Book Title</th>
            <th>Author</th>
            <th>Price</th>
            <th>Actions</th>
          </tr>
        </thead>
        <tbody id="booksTableBody"></tbody>
      </table>
    </div>
  </div>
  <script src="script.js"></script>
</body>
</html>
